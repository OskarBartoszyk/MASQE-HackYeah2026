<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>MASQE architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4b5753"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c4473a"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f7f7f3"/>
  <text x="40" y="52" font-size="26" font-weight="600" fill="#1f2a27">MASQE — zero-trust gateway for Agentic AI</text>
  <text x="40" y="78" font-size="14" fill="#5d6765">Central policy enforcement, protected execution and live visibility into agent activity.</text>

  <!-- Clients -->
  <g font-size="13" fill="#1f2a27">
    <text x="40" y="122" font-size="11" letter-spacing="1.5" fill="#7d8774">CLIENTS</text>
    <rect x="40" y="134" width="210" height="52" rx="7" fill="#fff" stroke="#cfd3cb"/><text x="56" y="157" font-weight="600">Agent</text><text x="56" y="175" font-size="11" fill="#6f7877">POST /v1/execute</text>
    <rect x="40" y="198" width="210" height="52" rx="7" fill="#fff" stroke="#cfd3cb"/><text x="56" y="221" font-weight="600">Any OpenAI SDK app</text><text x="56" y="239" font-size="11" fill="#6f7877">/v1/chat/completions</text>
    <rect x="40" y="262" width="210" height="52" rx="7" fill="#fff" stroke="#cfd3cb"/><text x="56" y="285" font-weight="600">Python SDK tools</text><text x="56" y="303" font-size="11" fill="#6f7877">/v1/authorize · /v1/outputs</text>
    <rect x="40" y="326" width="210" height="52" rx="7" fill="#fff" stroke="#cfd3cb"/><text x="56" y="349" font-weight="600">MCP client / server</text><text x="56" y="367" font-size="11" fill="#6f7877">masqe_mcp.py (stdio)</text>
    <rect x="40" y="390" width="210" height="52" rx="7" fill="#fff" stroke="#cfd3cb"/><text x="56" y="413" font-weight="600">User-facing app</text><text x="56" y="431" font-size="11" fill="#6f7877">/v1/sessions (registers intent)</text>
  </g>
  <g stroke="#4b5753" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M250 160 H322"/><path d="M250 224 H322"/><path d="M250 288 H322"/><path d="M250 352 H322"/><path d="M250 416 H322"/>
  </g>

  <!-- Gateway -->
  <rect x="326" y="110" width="430" height="400" rx="12" fill="#e9efe6" stroke="#6f8f7a" stroke-width="1.5"/>
  <text x="346" y="140" font-size="16" font-weight="700" fill="#24402f">MASQE Go Gateway</text>
  <text x="346" y="158" font-size="11" fill="#4f6a58">the only component that decides</text>
  <g font-size="12" fill="#1f2a27">
    <rect x="346" y="172" width="390" height="44" rx="6" fill="#fff" stroke="#c5d3c0"/><text x="360" y="191" font-weight="600">1 · Identity &amp; authority</text><text x="360" y="207" font-size="11" fill="#5d6765">API key → user · role ∩ agent ∩ action ∩ resource policy</text>
    <rect x="346" y="224" width="390" height="44" rx="6" fill="#fff" stroke="#c5d3c0"/><text x="360" y="243" font-weight="600">2 · Deterministic guards + local PII model</text><text x="360" y="259" font-size="11" fill="#5d6765">HerBERT PII · secrets · signatures · honeytokens</text>
    <rect x="346" y="276" width="390" height="44" rx="6" fill="#fff" stroke="#c5d3c0"/><text x="360" y="295" font-weight="600">3 · Semantic escalation (only when needed)</text><text x="360" y="311" font-size="11" fill="#5d6765">injection · exfiltration · Intent Lock · Privilege Drift · memory poisoning</text>
    <rect x="346" y="328" width="390" height="44" rx="6" fill="#fff" stroke="#c5d3c0"/><text x="360" y="347" font-weight="600">4 · Risk engine → decision</text><text x="360" y="363" font-size="11" fill="#5d6765">risk → ALLOW · REDACT · GHOST · APPROVAL · BLOCK</text>
    <rect x="346" y="380" width="390" height="44" rx="6" fill="#fff" stroke="#c5d3c0"/><text x="360" y="399" font-weight="600">5 · Execution with redacted input</text><text x="360" y="415" font-size="11" fill="#5d6765">only allowed actions reach tools and models</text>
    <rect x="346" y="432" width="390" height="44" rx="6" fill="#fff" stroke="#c5d3c0"/><text x="360" y="451" font-weight="600">6 · Output guard</text><text x="360" y="467" font-size="11" fill="#5d6765">PII · secrets · honeytokens · signatures · indirect prompt injection</text>
  </g>
  <text x="346" y="498" font-size="11" fill="#4f6a58">decision trace + hash-chained audit for every request · SSE live stream</text>

  <!-- AI Guard -->
  <rect x="820" y="250" width="420" height="104" rx="10" fill="#fff" stroke="#cfd3cb"/>
  <text x="838" y="276" font-size="15" font-weight="700" fill="#1f2a27">Python AI Guard</text>
  <text x="838" y="298" font-size="12" fill="#3d4842">local ML classifier + EN/PL attack patterns</text>
  <text x="838" y="316" font-size="12" fill="#3d4842">concept-based Intent Lock · leetspeak · anti-dilution</text>
  <text x="838" y="334" font-size="12" fill="#3d4842">async plain-language explanations (local Gemma)</text>
  <path d="M736 298 H816" stroke="#4b5753" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M816 318 H740" stroke="#4b5753" stroke-width="1.6" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>

  <!-- Tools / models -->
  <rect x="820" y="110" width="200" height="110" rx="10" fill="#fff" stroke="#cfd3cb"/>
  <text x="838" y="136" font-size="15" font-weight="700" fill="#1f2a27">Tools</text>
  <text x="838" y="158" font-size="12" fill="#3d4842">CRM · database · e-mail</text><text x="838" y="176" font-size="12" fill="#3d4842">memory · documents · APIs</text><text x="838" y="194" font-size="12" fill="#3d4842">MCP servers</text>
  <rect x="1040" y="110" width="200" height="110" rx="10" fill="#fff" stroke="#cfd3cb"/>
  <text x="1058" y="136" font-size="15" font-weight="700" fill="#1f2a27">Models</text>
  <text x="1058" y="158" font-size="12" fill="#3d4842">Ollama (local)</text><text x="1058" y="176" font-size="12" fill="#3d4842">OpenAI-compatible APIs</text><text x="1058" y="194" font-size="12" fill="#3d4842">cost + token budgets</text>
  <path d="M736 402 C790 402 790 190 816 190" stroke="#4b5753" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="782" y="232" font-size="10" fill="#5d6765" transform="rotate(-90 782 232)">allowed only</text>

  <!-- Ghost Shell -->
  <rect x="820" y="384" width="420" height="126" rx="10" fill="#fbefec" stroke="#c4473a" stroke-width="1.4"/>
  <text x="838" y="410" font-size="15" font-weight="700" fill="#8c2f24">Ghost Shell — adaptive isolation</text>
  <text x="838" y="432" font-size="12" fill="#5a3a33">untrusted code → emulated workspace, nothing executes</text>
  <text x="838" y="450" font-size="12" fill="#5a3a33">honeytokens in .env / credentials / ssh keys</text>
  <text x="838" y="468" font-size="12" fill="#5a3a33">honeytoken in ANY channel = confirmed exfiltration</text>
  <text x="838" y="486" font-size="12" fill="#5a3a33">SHA-256 hash-chained recorder · incident</text>
  <path d="M736 350 C790 350 790 440 816 440" stroke="#c4473a" stroke-width="1.6" fill="none" marker-end="url(#r)"/>
  <text x="768" y="392" font-size="10" fill="#c4473a">GHOST</text>

  <!-- Policy -->
  <rect x="326" y="548" width="430" height="70" rx="10" fill="#fff" stroke="#cfd3cb"/>
  <text x="344" y="574" font-size="15" font-weight="700" fill="#1f2a27">Central policy</text>
  <text x="344" y="596" font-size="12" fill="#3d4842">policy.yaml · threat-feed.yaml · remote feed (https)</text>
  <text x="344" y="612" font-size="11" fill="#6f7877">hot reload · validated · last valid snapshot keeps serving</text>
  <path d="M541 548 V514" stroke="#4b5753" stroke-width="1.6" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>

  <!-- Console -->
  <rect x="820" y="548" width="420" height="70" rx="10" fill="#26332d"/>
  <text x="838" y="574" font-size="15" font-weight="700" fill="#eef3ec">Security console</text>
  <text x="838" y="596" font-size="12" fill="#c9d6cc">live agent graph · incidents workflow · decision trace</text>
  <text x="838" y="612" font-size="11" fill="#9fb1a5">tamper-evident audit · budgets · latency percentiles · CSV/JSON export</text>
  <path d="M756 490 C800 490 790 583 816 583" stroke="#4b5753" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="786" y="530" font-size="10" fill="#5d6765" text-anchor="end">HMAC-chained</text><text x="786" y="542" font-size="10" fill="#5d6765" text-anchor="end">audit</text>

  <text x="40" y="690" font-size="12" fill="#6f7877">Policy-checked access · deterministic + semantic controls · fail-closed when required analysis is unavailable.</text>
</svg>
